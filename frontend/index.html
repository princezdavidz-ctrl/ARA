<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>ARA Agency Dashboard</title><link rel="stylesheet" href="./styles.css"></head>
<body><main id="app"><section class="login-wrap"><form id="login" class="panel login"><div class="brand">ARA <span>AGENCY WORKSPACE</span></div><h1>Sign in to your agency</h1><p class="muted">Manage property enquiries, listings and customer conversations.</p><label>Agency slug<input name="agencySlug" autocomplete="organization" required placeholder="your-agency-slug"></label><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="login-error" class="error" role="alert"></p></form></section></main><script src="./config.js"></script><script src="./app.js" defer></script></body></html>
