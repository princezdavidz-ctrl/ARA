name: ARA CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ara
          POSTGRES_PASSWORD: ara_test_password
          POSTGRES_DB: ara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ara -d ara_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ara:ara_test_password@localhost:5432/ara_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      INGESTION_API_KEY: ci-only-ingestion-key-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Apply database migrations
        run: for migration in migrations/*.sql; do echo "Applying $migration"; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --passWithNoTests
