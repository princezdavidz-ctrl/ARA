services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ara
      POSTGRES_PASSWORD: change-this-password
      POSTGRES_DB: ara_rag
    ports:
      - "5432:5432"
    volumes:
      - ara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ara -d ara_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ara_pgdata:
