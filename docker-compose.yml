services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ara
    ports: ["5432:5432"]
    volumes: ["ara_pg:/var/lib/postgresql/data", "./migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ara -d ara"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  ara_pg:
